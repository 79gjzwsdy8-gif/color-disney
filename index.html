<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7c6d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Color Disney">
<title>Color Disney</title>
<style>
:root{--pink:#e78bb1;--pink2:#fbe5ee;--ink:#503545;--muted:#947889;--bg:#fff8fb;--white:#fff;--line:#f1d6e2;--shadow:0 8px 24px #7f35500e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:22px 18px 18px;background:linear-gradient(135deg,#fbe5ee,#fff7fa);border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:12px}.logo{height:48px;width:48px;border-radius:17px;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow)}h1{font-size:23px;margin:0;letter-spacing:-.5px}.subtitle{font-size:13px;color:var(--muted);margin-top:4px}.welcome{margin-top:21px;font-size:14px;line-height:1.5}.content{padding:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 13px}.section-head h2{font-size:18px;margin:0}.small{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,.panel,.stat{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow)}.tile{min-height:120px;text-align:left;color:var(--ink)}.tile .emoji{font-size:26px;display:block;margin-bottom:10px}.tile b{display:block;font-size:14px}.tile span:last-child{font-size:12px;color:var(--muted);display:block;margin-top:5px}.primary{background:var(--pink);color:white;padding:11px 15px;border-radius:13px;font-weight:650}.secondary{background:var(--pink2);color:var(--ink);padding:10px 13px;border-radius:12px;font-weight:600}.ghost{background:transparent;color:var(--muted);padding:8px}.full{width:100%}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfef2;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));}.nav-inner{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{background:transparent;color:var(--muted);padding:7px 3px;border-radius:12px;font-size:11px}.nav button.active{background:var(--pink2);color:#9d426d;font-weight:700}.nav .nicon{font-size:20px;display:block;margin-bottom:3px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:12px}.input{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px;color:var(--ink);outline-color:var(--pink)}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}.page-thumb{height:145px;border-radius:14px;background:linear-gradient(140deg,#fce8f0,#fff);display:grid;place-items:center;font-size:48px;overflow:hidden}.page-thumb img{width:100%;height:100%;object-fit:cover}.book-card{background:white;border:1px solid var(--line);border-radius:18px;padding:10px;min-width:0}.book-card h3{font-size:13px;margin:9px 2px 4px}.book-card p{font-size:11px;color:var(--muted);margin:0 2px 8px}.marker-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.marker{border:1px solid #ead9e1;border-radius:10px;padding:5px 2px;background:white;text-align:center;font-size:10px;color:var(--ink)}.swatch{height:25px;border-radius:6px;margin-bottom:4px;border:1px solid #0000000c}.timer{font-size:36px;font-weight:750;letter-spacing:1px;text-align:center;padding:20px 0}.empty{text-align:center;padding:25px 15px;color:var(--muted);font-size:13px;line-height:1.5}.chip{display:inline-flex;padding:5px 9px;border-radius:99px;background:var(--pink2);font-size:11px;color:#9d426d}.hidden{display:none!important}.page-image{max-width:100%;max-height:50vh;border-radius:15px;object-fit:contain;background:#fff}.notice{background:#fff4d9;border:1px solid #f2dfae;color:#7d6331;padding:12px;border-radius:13px;font-size:12px;line-height:1.5}.list-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.list-item img{width:54px;height:64px;object-fit:cover;border-radius:9px}.list-item .meta{flex:1;min-width:0}.list-item b{font-size:13px}.list-item p{font-size:11px;color:var(--muted);margin:4px 0}.pill-tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.pill-tabs button{white-space:nowrap;background:white;border:1px solid var(--line);border-radius:99px;padding:8px 12px;color:var(--muted);font-size:12px}.pill-tabs button.active{background:var(--pink2);color:#9d426d;border-color:#edb8ce}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.marker-grid{grid-template-columns:repeat(12,minmax(0,1fr))}.top{padding:28px 28px 22px}.content{padding:24px}.page-thumb{height:175px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">🎨</div><div><h1>Color Disney</h1><div class="subtitle">Twoje miejsce na kolorowe chwile</div></div></div><div class="welcome">Wybierz stronę, dopasuj swoje kolory i zapisuj każdą ukończoną pracę. 💗</div></header>
<main class="content" id="view"></main>
<nav class="nav"><div class="nav-inner">
<button class="active" data-tab="home"><span class="nicon">⌂</span>Start</button>
<button data-tab="library"><span class="nicon">📚</span>Biblioteka</button>
<button data-tab="markers"><span class="nicon">🖍️</span>Markery</button>
<button data-tab="gallery"><span class="nicon">🖼️</span>Moje prace</button>
</div></nav>
</div>
<input type="file" id="fileInput" accept="image/*" class="hidden">
<script>
const KEY='colorDisneyV1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{pages:[],works:[],markers:[],activeTimer:null};
let tab='home', selectedPage=null, timerHandle=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,'0')).join(':')}
function elapsed(){return data.activeTimer?Math.floor((Date.now()-data.activeTimer.startedAt)/1000):0}
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(){let v=$('#view');if(tab==='home')v.innerHTML=home();if(tab==='library')v.innerHTML=library();if(tab==='markers')v.innerHTML=markers();if(tab==='gallery')v.innerHTML=gallery();bind()}
function home(){let recent=data.works.slice().reverse()[0];return `<div class="section-head"><h2>Cześć, kolorystko! 🌸</h2><span class="chip">${data.markers.length||144} kolorów</span></div><div class="grid">
<button class="tile" onclick="go('library')"><span class="emoji">📚</span><b>Biblioteka</b><span>Wybierz stronę do kolorowania</span></button>
<button class="tile" onclick="go('markers')"><span class="emoji">🖍️</span><b>Moje markery</b><span>Twoja paleta kolorów</span></button>
<button class="tile" onclick="startQuick()"><span class="emoji">⏱️</span><b>Stoper kolorowania</b><span>${data.activeTimer?'Wróć do aktywnej sesji':'Zacznij mierzyć czas'}</span></button>
<button class="tile" onclick="go('gallery')"><span class="emoji">💗</span><b>Moje prace</b><span>${data.works.length} zapisanych sesji</span></button></div>
<div class="section-head" style="margin-top:24px"><h2>${data.activeTimer?'Trwa kolorowanie':'Ostatnia praca'}</h2></div>
${data.activeTimer?`<div class="panel"><div class="small">${esc(data.activeTimer.title||'Kolorowanie')}</div><div class="timer" id="homeTimer">${fmt(elapsed())}</div><div class="row"><button class="secondary" onclick="pauseTimer()">Zakończ i zapisz</button><button class="ghost" onclick="stopTimer()">Anuluj sesję</button></div></div>`:recent?`<div class="panel row">${recent.image?`<img src="${recent.image}" style="width:70px;height:85px;object-fit:cover;border-radius:12px">`:'<div style="font-size:36px">✨</div>'}<div style="flex:1"><b>${esc(recent.title)}</b><div class="small">${new Date(recent.date).toLocaleDateString('pl-PL')} · ${fmt(recent.seconds)}</div></div></div>`:`<div class="panel empty">Twoja pierwsza kolorowanka czeka! Dodaj stronę z własnej książki lub rozpocznij sesję. ✨</div>`}
<div class="notice" style="margin-top:16px"><b>Ważne:</b> To pierwsza wersja aplikacji. Możesz dodawać własne zdjęcia stron i zapisywać postępy. Pełna biblioteka Disney oraz automatyczne rozpoznawanie kodów wymagają osobnych danych i dalszego wdrożenia.</div>`}
function library(){return `<div class="section-head"><h2>Biblioteka stron</h2><button class="primary" onclick="addPage()">＋ Dodaj stronę</button></div><p class="small">Dodaj zdjęcie strony z własnej kolorowanki. Twoje strony zostaną zapisane na tym urządzeniu.</p>${data.pages.length?`<div class="grid">${data.pages.slice().reverse().map(p=>`<div class="book-card"><div class="page-thumb">${p.image?`<img src="${p.image}">`:'📖'}</div><h3>${esc(p.title)}</h3><p>${esc(p.book||'Własna książka')}</p><div class="row"><button class="secondary" style="flex:1" onclick="openPage('${p.id}')">Otwórz</button><button class="ghost" onclick="deletePage('${p.id}')">✕</button></div></div>`).join('')}</div>`:`<div class="panel empty"><div style="font-size:38px">📚</div><b>Twoja biblioteka jest pusta</b><p>Dodaj zdjęcie strony i nadaj jej nazwę. Nie dodajemy nielegalnie skanów książek innych osób.</p><button class="primary" onclick="addPage()">Dodaj pierwszą stronę</button></div>`}`}
function markers(){let ms=data.markers;return `<div class="section-head"><h2>Moje 144 żelopisy</h2><button class="primary" onclick="editMarkers()">Edytuj paletę</button></div><div class="notice">Wstępnie przygotowano 144 miejsca na numery. Kolory są tymczasowymi podglądami, a nie potwierdzonym wzornikiem Languo Plus — możesz je później poprawić.</div><div class="panel" style="margin-top:14px"><div class="row between"><b>Paleta markerów</b><span class="small">${ms.length||144} pozycji</span></div><div class="marker-grid" style="margin-top:12px">${Array.from({length:144},(_,i)=>{let m=ms[i]||{code:String(i+1),color:`hsl(${i*360/144},65%,65%)`};return `<button class="marker" onclick="editMarker(${i})"><div class="swatch" style="background:${esc(m.color||'#ddd')}"></div>${esc(m.code||i+1)}</button>`}).join('')}</div></div>`}
function gallery(){return `<div class="section-head"><h2>Moje prace</h2><span class="chip">${data.works.length} zapisanych</span></div>${data.works.length?`<div class="stack">${data.works.slice().reverse().map(w=>`<div class="panel row">${w.image?`<img src="${w.image}" style="width:76px;height:92px;object-fit:cover;border-radius:12px">`:'<div style="font-size:32px">🌷</div>'}<div style="flex:1;min-width:0"><b>${esc(w.title)}</b><div class="small">${new Date(w.date).toLocaleDateString('pl-PL')} · ${fmt(w.seconds)}</div>${w.note?`<p class="small">${esc(w.note)}</p>`:''}</div><button class="ghost" onclick="deleteWork('${w.id}')">✕</button></div>`).join('')}</div>`:`<div class="panel empty">Tutaj pojawią się zdjęcia ukończonych kolorowanek i czas każdej sesji.</div>`}`}
function bind(){}
function addPage(){let title=prompt('Nazwa strony, np. Myszka Miki — strona 12:');if(!title)return;let book=prompt('Tytuł książki (opcjonalnie):')||'Moja kolorowanka';let id='p'+Date.now();selectedPage={id,title,book};$('#fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let image=await compress(f);data.pages.push({id,title,book,image});save();render()}catch(err){alert('Nie udało się wczytać zdjęcia. Spróbuj mniejszego pliku.')}};$('#fileInput').click()}
function compress(file){return new Promise((res,rej)=>{let r=new FileReader();r.onerror=rej;r.onload=()=>{let im=new Image();im.onerror=rej;im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}
function openPage(id){let p=data.pages.find(x=>x.id===id);if(!p)return;let start=confirm(`Strona: ${p.title}\n\nOK — rozpocznij stoper\nAnuluj — tylko podgląd`);if(start){if(data.activeTimer&&!confirm('Jest już aktywna sesja. Zastąpić ją?'))return;data.activeTimer={pageId:id,title:p.title,startedAt:Date.now()};save();go('home')}else{alert('Strona: '+p.title+'\nKsiążka: '+p.book)}}
function deletePage(id){if(confirm('Usunąć tę stronę z biblioteki?')){data.pages=data.pages.filter(p=>p.id!==id);save();render()}}
function startQuick(){if(data.activeTimer){go('home');return}let title=prompt('Co kolorujesz?','Kolorowanka Disney');if(!title)return;data.activeTimer={title,startedAt:Date.now()};save();go('home')}
function pauseTimer(){if(!data.activeTimer)return;let t=data.activeTimer;let seconds=elapsed();let title=t.title;let id='w'+Date.now();let yes=confirm(`Zakończyć „${title}”?\nCzas: ${fmt(seconds)}\n\nOK — dodaj zdjęcie gotowej pracy\nAnuluj — zapisz bez zdjęcia`);data.activeTimer=null;data._pendingWork={id,title,seconds,date:Date.now(),image:null,note:''};save();if(yes){$('#fileInput').onchange=async e=>{let f=e.target.files[0];if(f){data._pendingWork.image=await compress(f)}finishWork()};$('#fileInput').click();setTimeout(()=>{if(data._pendingWork)finishWork()},15000)}else finishWork()}
function finishWork(){if(!data._pendingWork)return;let note=prompt('Notatka (opcjonalnie):','')||'';data._pendingWork.note=note;data.works.push(data._pendingWork);data._pendingWork=null;save();go('gallery')}
function stopTimer(){if(confirm('Anulować sesję bez zapisywania?')){data.activeTimer=null;save();render()}}
function editMarkers(){let code=prompt('Wpisz numery markerów oddzielone przecinkami (opcjonalnie). Zostaw puste, aby zachować numerację 1–144.');if(code===null)return;if(!code.trim()){data.markers=Array.from({length:144},(_,i)=>({code:String(i+1),color:`hsl(${i*360/144},65%,65%)`}));save();render();return}let vals=code.split(',').map(x=>x.trim()).filter(Boolean).slice(0,144);data.markers=Array.from({length:144},(_,i)=>({code:vals[i]||String(i+1),color:data.markers[i]?.color||`hsl(${i*360/144},65%,65%)`}));save();render()}
function editMarker(i){let old=data.markers[i]||{code:String(i+1),color:`hsl(${i*360/144},65%,65%)`};let code=prompt('Kod / numer żelopisu:',old.code);if(code===null)return;let color=prompt('Kolor próbki w formacie HEX, np. #e58bad:',old.color.startsWith('#')?old.color:'#e58bad');if(color===null)return;if(!/^#[0-9a-f]{6}$/i.test(color)){alert('Użyj formatu #RRGGBB.');return}data.markers[i]={code,color};save();render()}
function deleteWork(id){if(confirm('Usunąć zapis tej pracy?')){data.works=data.works.filter(w=>w.id!==id);save();render()}}
setInterval(()=>{let el=$('#homeTimer');if(el&&data.activeTimer)el.textContent=fmt(elapsed())},1000);
render();
</script>
</body>
</html>
